<div class="games-page">
  <div class="page-header">
    <h1>{{ title }}</h1>

    <div class="search-row">
      <input
        type="text"
        class="form-control"
        [ngModel]="query"
        (ngModelChange)="onQueryChange($event)"
        (keyup.enter)="reload()"
        [placeholder]="'games.searchPlaceholder' | translate"
        [attr.aria-label]="'games.searchPlaceholder' | translate" />
      <button type="button" class="btn btn-primary" (click)="reload()">{{ 'games.search' | translate }}</button>
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="clear()"
        *ngIf="query || category || device || orientation || exclusivity !== 'All' || minRating">
        {{ 'games.clear' | translate }}
      </button>
    </div>

    <div class="filters row g-2 align-items-end">
      <div class="col-6 col-md" *ngIf="categories?.length">
        <label class="form-label">{{ 'games.category' | translate }}</label>
        <select class="form-select" [(ngModel)]="category" (change)="reload()">
          <option value="">{{ 'games.allCategories' | translate }}</option>
          <option *ngFor="let c of categories" [value]="c.slug">{{ c.name }}</option>
        </select>
      </div>
      <div class="col-6 col-md">
        <label class="form-label">{{ 'games.device' | translate }}</label>
        <select class="form-select" [(ngModel)]="device" (change)="reload()">
          <option value="">{{ 'games.allDevices' | translate }}</option>
          <option value="Desktop">{{ 'games.desktop' | translate }}</option>
          <option value="Mobile">{{ 'games.mobile' | translate }}</option>
          <option value="Tablet">{{ 'games.tablet' | translate }}</option>
        </select>
      </div>
      <div class="col-6 col-md">
        <label class="form-label">{{ 'games.orientation' | translate }}</label>
        <select class="form-select" [(ngModel)]="orientation" (change)="reload()">
          <option value="">{{ 'games.allOrientations' | translate }}</option>
          <option value="Landscape">{{ 'games.landscape' | translate }}</option>
          <option value="Portrait">{{ 'games.portrait' | translate }}</option>
          <option value="Both">{{ 'games.both' | translate }}</option>
        </select>
      </div>
      <div class="col-6 col-md">
        <label class="form-label">{{ 'games.exclusivity' | translate }}</label>
        <select class="form-select" [(ngModel)]="exclusivity" (change)="reload()">
          <option value="All">{{ 'games.allExclusivities' | translate }}</option>
          <option value="WebExclusive">{{ 'games.webExclusive' | translate }}</option>
          <option value="NonExclusive">{{ 'games.nonExclusive' | translate }}</option>
        </select>
      </div>
      <div class="col-6 col-md">
        <label class="form-label">{{ 'games.minRating' | translate }}</label>
        <select class="form-select" [(ngModel)]="minRating" (change)="reload()">
          <option [ngValue]="0">-</option>
          <option *ngFor="let r of [1, 2, 3, 4, 5]" [ngValue]="r">{{ r }}+</option>
        </select>
      </div>
    </div>
  </div>

  <div class="skeleton-grid" *ngIf="loading && !games.length">
    <div class="game-card-skeleton" *ngFor="let _ of [1,2,3,4,5,6]">
      <app-skeleton width="100%" height="160px" radius="1rem"></app-skeleton>
      <app-skeleton width="70%" height="1rem"></app-skeleton>
    </div>
  </div>

  <div class="game-grid" *ngIf="games?.length">
    <app-game-card *ngFor="let game of games" [game]="game"></app-game-card>
  </div>

  <div class="load-more" *ngIf="games?.length && totalCount > games.length">
    <app-button variant="primary" (appClick)="loadMore()" [disabled]="loading">{{ 'games.loadMore' | translate }}</app-button>
  </div>

  <div class="empty-state" *ngIf="!loading && !games?.length">
    <p *ngIf="query || category || device || orientation || exclusivity !== 'All' || minRating; else noGames">{{ 'games.noResults' | translate }}</p>
    <ng-template #noGames>
      <p>{{ 'emptyState.home' | translate }}</p>
    </ng-template>
    <button
      class="btn btn-outline-primary"
      (click)="clear()"
      *ngIf="query || category || device || orientation || exclusivity !== 'All' || minRating">
      {{ 'games.clearFilters' | translate }}
    </button>
  </div>
</div>
