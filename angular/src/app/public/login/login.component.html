<div class="auth-page">
  <form class="auth-card" (ngSubmit)="login()">
    <h1>Login to GameHub</h1>
    <p class="subtitle">Access your favorites, leaderboards and developer tools.</p>

    <label for="userName">Username or email</label>
    <input id="userName" type="text" [(ngModel)]="model.userNameOrEmailAddress" name="userName" required />

    <label for="password">Password</label>
    <input id="password" type="password" [(ngModel)]="model.password" name="password" required />

    <button type="submit" class="btn-primary" [disabled]="loading">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>

    <p class="switch">Don't have an account? <a routerLink="/register">Register</a></p>
  </form>
</div>
