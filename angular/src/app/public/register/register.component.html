<div class="auth-page">
  <form class="auth-card" (ngSubmit)="register()">
    <h1>{{ 'register.title' | translate }}</h1>
    <p class="subtitle">{{ 'register.subtitle' | translate }}</p>

    <div class="row g-3">
      <div class="col-md-6">
        <label for="name" class="form-label">{{ 'register.firstName' | translate }}</label>
        <input
          id="name"
          type="text"
          class="form-control"
          [(ngModel)]="model.name"
          name="name"
          required />
      </div>
      <div class="col-md-6">
        <label for="surname" class="form-label">{{ 'register.lastName' | translate }}</label>
        <input
          id="surname"
          type="text"
          class="form-control"
          [(ngModel)]="model.surname"
          name="surname"
          required />
      </div>
      <div class="col-md-6">
        <label for="userName" class="form-label">{{ 'register.userName' | translate }}</label>
        <input
          id="userName"
          type="text"
          class="form-control"
          [(ngModel)]="model.userName"
          name="userName"
          required />
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">{{ 'register.email' | translate }}</label>
        <input
          id="email"
          type="email"
          class="form-control"
          [(ngModel)]="model.emailAddress"
          name="email"
          required />
      </div>
      <div class="col-md-6">
        <label for="password" class="form-label">{{ 'register.password' | translate }}</label>
        <input
          id="password"
          type="password"
          class="form-control"
          [(ngModel)]="model.password"
          name="password"
          required />
        <p class="form-text">{{ 'register.passwordHint' | translate }}</p>
      </div>
      <div class="col-md-6">
        <label for="confirmPassword" class="form-label">{{ 'register.confirmPassword' | translate }}</label>
        <input
          id="confirmPassword"
          type="password"
          class="form-control"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required />
      </div>
    </div>

    <div class="form-check mt-3">
      <input
        class="form-check-input"
        type="checkbox"
        [(ngModel)]="model.isDeveloper"
        name="isDeveloper"
        id="isDeveloper"
        (change)="onDeveloperChange()" />
      <label class="form-check-label" for="isDeveloper">{{ 'register.isDeveloper' | translate }}</label>
    </div>

    <div class="tenant-section mt-3">
      <h3>{{ 'register.tenantTitle' | translate }}</h3>

      <div class="form-check">
        <input
          class="form-check-input"
          type="radio"
          name="tenantMode"
          id="tenantPlayer"
          value="PlayerDefault"
          [(ngModel)]="tenantMode"
          (change)="onTenantModeChange()"
          [disabled]="model.isDeveloper ?? false" />
        <label class="form-check-label" for="tenantPlayer">{{ 'register.tenantPlayer' | translate }}</label>
      </div>
      <div class="form-check">
        <input
          class="form-check-input"
          type="radio"
          name="tenantMode"
          id="tenantCreate"
          value="CreateNew"
          [(ngModel)]="tenantMode"
          (change)="onTenantModeChange()" />
        <label class="form-check-label" for="tenantCreate">{{ 'register.tenantCreate' | translate }}</label>
      </div>
      <div class="form-check">
        <input
          class="form-check-input"
          type="radio"
          name="tenantMode"
          id="tenantJoin"
          value="JoinExisting"
          [(ngModel)]="tenantMode"
          (change)="onTenantModeChange()" />
        <label class="form-check-label" for="tenantJoin">{{ 'register.tenantJoin' | translate }}</label>
      </div>

      <div *ngIf="tenantMode === 'CreateNew'" class="mt-3">
        <label for="newTenantName" class="form-label">{{ 'register.companyName' | translate }}</label>
        <input
          id="newTenantName"
          type="text"
          class="form-control"
          [(ngModel)]="model.newTenantName"
          name="newTenantName" />
      </div>

      <div *ngIf="tenantMode === 'JoinExisting'" class="mt-3">
        <label for="existingTenant" class="form-label">{{ 'register.selectCompany' | translate }}</label>
        <select
          id="existingTenant"
          name="existingTenant"
          class="form-select"
          [(ngModel)]="model.existingTenantId"
          required>
          <option [ngValue]="null">-- {{ 'register.selectCompany' | translate }} --</option>
          <option *ngFor="let tenant of availableTenants" [ngValue]="tenant.id">{{ tenant.name }}</option>
        </select>

        <label for="joinMessage" class="form-label mt-3">{{ 'register.joinMessage' | translate }}</label>
        <textarea
          id="joinMessage"
          class="form-control"
          [(ngModel)]="model.joinRequestMessage"
          name="joinRequestMessage"
          rows="3"></textarea>
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100 mt-4" [disabled]="loading">
      {{ loading ? ('register.registering' | translate) : ('register.submit' | translate) }}
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>

    <p class="switch">{{ 'register.haveAccount' | translate }} <a routerLink="/login">{{ 'register.login' | translate }}</a></p>
  </form>
</div>
