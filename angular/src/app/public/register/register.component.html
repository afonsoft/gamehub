<div class="auth-page">
  <form class="auth-card" (ngSubmit)="register()">
    <h1>Create your GameHub account</h1>
    <p class="subtitle">Join to save favorites, compete and publish games.</p>

    <label for="name">First name</label>
    <input id="name" type="text" [(ngModel)]="model.name" name="name" required />

    <label for="surname">Last name</label>
    <input id="surname" type="text" [(ngModel)]="model.surname" name="surname" required />

    <label for="userName">Username</label>
    <input id="userName" type="text" [(ngModel)]="model.userName" name="userName" required />

    <label for="email">Email</label>
    <input id="email" type="email" [(ngModel)]="model.emailAddress" name="email" required />

    <label for="password">Password</label>
    <input id="password" type="password" [(ngModel)]="model.password" name="password" required />
    <p class="hint">{{ 'register.passwordHint' | translate }}</p>

    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />

    <label class="checkbox">
      <input type="checkbox" [(ngModel)]="model.isDeveloper" name="isDeveloper" (change)="onDeveloperChange()" />
      I want to publish games (developer account)
    </label>

    <div class="tenant-section">
      <h3>Company / Tenant</h3>

      <label class="radio">
        <input type="radio" name="tenantMode" value="PlayerDefault" [(ngModel)]="tenantMode" (change)="onTenantModeChange()" [disabled]="model.isDeveloper ?? false" />
        I just want to play (public player)
      </label>

      <label class="radio">
        <input type="radio" name="tenantMode" value="CreateNew" [(ngModel)]="tenantMode" (change)="onTenantModeChange()" />
        I want to create my own company (tenant admin)
      </label>

      <label class="radio">
        <input type="radio" name="tenantMode" value="JoinExisting" [(ngModel)]="tenantMode" (change)="onTenantModeChange()" />
        I want to join an existing company (requires approval)
      </label>

      <div *ngIf="tenantMode === 'CreateNew'" class="tenant-field">
        <label for="newTenantName">Company name</label>
        <input id="newTenantName" type="text" [(ngModel)]="model.newTenantName" name="newTenantName" />
      </div>

      <div *ngIf="tenantMode === 'JoinExisting'" class="tenant-field">
        <label for="existingTenant">Select company</label>
        <select id="existingTenant" name="existingTenant" [(ngModel)]="model.existingTenantId" required>
          <option [ngValue]="null">-- Select a company --</option>
          <option *ngFor="let tenant of availableTenants" [ngValue]="tenant.id">{{ tenant.name }}</option>
        </select>

        <label for="joinMessage">Message to admins (optional)</label>
        <textarea id="joinMessage" [(ngModel)]="model.joinRequestMessage" name="joinRequestMessage" rows="3"></textarea>
      </div>
    </div>

    <button type="submit" class="btn-primary" [disabled]="loading">
      {{ loading ? 'Registering...' : 'Register' }}
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>

    <p class="switch">Already have an account? <a routerLink="/login">Login</a></p>
  </form>
</div>
