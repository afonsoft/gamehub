<div class="company-page">
  <div class="company-card" *ngIf="!loading && company">
    <h1>{{ company.name }}</h1>
    <p class="text-muted">{{ company.tenancyName }}</p>

    <dl>
      <dt>Contact</dt>
      <dd>{{ company.primaryContactEmail }}</dd>
      <dt>Country</dt>
      <dd>{{ company.country || '-' }}</dd>
      <dt>Team size</dt>
      <dd>{{ company.employeeCount }}</dd>
    </dl>

    <button class="btn btn-primary" (click)="showJoinForm = !showJoinForm">
      Join as developer
    </button>
  </div>

  <div class="company-card" *ngIf="showJoinForm">
    <h2>Join {{ company?.name }}</h2>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div *ngIf="success" class="alert alert-success">{{ success }}</div>

    <form (ngSubmit)="join()">
      <div class="form-group">
        <label>Username</label>
        <input class="form-control" [(ngModel)]="joinModel.userName" name="userName" required />
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label>First name</label>
          <input class="form-control" [(ngModel)]="joinModel.name" name="name" required />
        </div>
        <div class="form-group col-md-6">
          <label>Last name</label>
          <input class="form-control" [(ngModel)]="joinModel.surname" name="surname" required />
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" [(ngModel)]="joinModel.emailAddress" name="emailAddress" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" [(ngModel)]="joinModel.password" name="password" required />
      </div>
      <div class="form-group">
        <label>Role</label>
        <select class="form-control" [(ngModel)]="joinModel.role" name="role">
          <option value="Developer">Developer</option>
          <option value="Support">Support</option>
          <option value="Billing">Billing</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        {{ saving ? 'Joining...' : 'Create account and join' }}
      </button>
    </form>
  </div>

  <div *ngIf="loading" class="company-card">Loading company...</div>
  <div *ngIf="!loading && !company" class="company-card">Company not found.</div>
</div>
