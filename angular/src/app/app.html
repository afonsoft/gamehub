<div class="hub-layout">
  <header class="hub-header">
    <div class="header-inner">
      <a class="logo" routerLink="/">GameHub</a>
      <nav class="header-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a routerLink="/games" routerLinkActive="active">All Games</a>
        <a *ngIf="isDeveloper" routerLink="/developer" routerLinkActive="active">Developer</a>
      </nav>
      <div class="header-actions">
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login">Login</a>
          <a class="btn-small" routerLink="/register">Register</a>
        </ng-container>
        <ng-container *ngIf="isLoggedIn">
          <span class="user-name" *ngIf="userName">{{ userName }}</span>
          <button class="btn-small" (click)="logout()">Logout</button>
        </ng-container>
      </div>
    </div>
  </header>

  <main class="hub-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="hub-footer">
    <div class="footer-inner">
      <p>GameHub — free browser games. No login required.</p>
      <nav>
        <a routerLink="/">Home</a>
        <a routerLink="/games">Games</a>
        <a routerLink="/developer" *ngIf="isDeveloper">Developer</a>
      </nav>
    </div>
  </footer>
</div>
