<div class="team-settings-page">
  <header class="developer-header">
    <nav>
      <a routerLink="/developer">Dashboard</a>
      <a routerLink="/developer/games">My Games</a>
      <a routerLink="/developer/team" routerLinkActive="active">Team</a>
      <a routerLink="/developer/profile">Profile</a>
    </nav>
  </header>

  <div class="page-content">
    <h2>Team Settings</h2>

    <div class="loading" *ngIf="loading">Loading...</div>

    <div *ngIf="error" class="error">{{ error }}</div>
    <div *ngIf="saved" class="success">Team settings saved successfully.</div>

    <form *ngIf="!loading" (ngSubmit)="save()" class="settings-form">
      <label>
        Team name
        <input type="text" [(ngModel)]="team.name" name="name" required />
      </label>

      <label>
        Primary contact email
        <input type="email" [(ngModel)]="team.primaryContactEmail" name="primaryContactEmail" required />
      </label>

      <label>
        Country
        <input type="text" [(ngModel)]="team.country" name="country" />
      </label>

      <button type="submit" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save settings' }}
      </button>
    </form>
  </div>
</div>
