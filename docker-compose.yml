services:
  backend:
    build:
      context: ./Api
      dockerfile: Dockerfile
    container_name: gamehub-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__Provider: ${Database__Provider:-PostgreSQL}
      ConnectionStrings__Default: Host=${POSTGRES_HOST:-host.docker.internal};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-A PREENCHER};Username=${POSTGRES_USER:-A PREENCHER};Password=${POSTGRES_PASSWORD:-A PREENCHER}
      RedisCache__IsEnabled: "true"
      RedisCache__ConnectionString: ${REDIS_CONNECTION:-host.docker.internal:6379,abortConnect=false}
      RedisCache__DatabaseId: "0"
      Hangfire__IsEnabled: "false"
      Storage__Provider: ${STORAGE_PROVIDER:-MinIO}
      Storage__Minio__Endpoint: ${MINIO_ENDPOINT:-http://gamehub-minio:9000}
      Storage__Minio__AccessKey: ${MINIO_ACCESS_KEY:-gamehub_user}
      Storage__Minio__SecretKey: ${MINIO_SECRET_KEY:-}
      Storage__Minio__Bucket: ${MINIO_BUCKET:-gamehub-builds}
      Storage__Minio__Region: ${MINIO_REGION:-us-east-1}
      Storage__Minio__ForcePathStyle: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otlp.nr-data.net:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      App__ServerRootAddress: ${GAMEHUB_API_URL:-A PREENCHER}
      App__ClientRootAddress: ${GAMEHUB_HUB_URL:-A PREENCHER}
      App__CorsOrigins: ${GAMEHUB_CORS_ORIGINS:-A PREENCHER}
    ports:
      - "4601:80"
    networks:
      - gamehub

  angular-hub:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: gamehub-angular-hub
    restart: unless-stopped
    ports:
      - "4600:80"
    networks:
      - gamehub

  angular-admin:
    build:
      context: ./angular-admin/GameHub.UI
      dockerfile: dockerfile
    container_name: gamehub-angular-admin
    restart: unless-stopped
    environment:
      REMOTE_SERVICE_BASE_URL: ${GAMEHUB_API_URL:-A PREENCHER}
      APP_BASE_URL: ${GAMEHUB_ADMIN_URL:-A PREENCHER}
    ports:
      - "4602:80"
    networks:
      - gamehub

  minio:
    image: minio/minio
    container_name: gamehub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-gamehub_user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    networks:
      - gamehub

networks:
  gamehub:
    driver: bridge
