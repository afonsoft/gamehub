services:
  backend:
    build:
      context: ./Api
      dockerfile: Dockerfile
    container_name: gamehub-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-gamehub};Username=${POSTGRES_USER:-gamehub};Password=${POSTGRES_PASSWORD:-change-me}
      RedisCache__IsEnabled: "true"
      RedisCache__ConnectionString: redis:6379
      RedisCache__DatabaseId: "0"
      Hangfire__IsEnabled: "false"
      App__ServerRootAddress: http://localhost:5000/
      App__CorsOrigins: "http://localhost:4200,http://localhost:4201"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:80"
    networks:
      - gamehub

  angular-hub:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: gamehub-angular-hub
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - gamehub

  angular-admin:
    build:
      context: ./angular-admin/GameHub.UI
      dockerfile: dockerfile
    container_name: gamehub-angular-admin
    restart: unless-stopped
    environment:
      REMOTE_SERVICE_BASE_URL: http://localhost:5000
      APP_BASE_URL: http://localhost:4201
    depends_on:
      - backend
    ports:
      - "4201:80"
    networks:
      - gamehub

networks:
  gamehub:
    driver: bridge
