services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamehub}
      POSTGRES_USER: ${POSTGRES_USER:-gamehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-change-me}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ./Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-gamehub};Username=${POSTGRES_USER:-gamehub};Password=${POSTGRES_PASSWORD:-change-me}
      Redis__Configuration: redis:6379
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:80"

  angular-hub:
    build:
      context: ./angular
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

  angular-admin:
    build:
      context: ./angular-admin/GameHub.UI
      dockerfile: dockerfile
    ports:
      - "4201:80"
    depends_on:
      - backend

volumes:
  pgdata:
