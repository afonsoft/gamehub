services:
  backend:
    build:
      context: ./Api
      dockerfile: Dockerfile
    container_name: gamehub-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__Provider: PostgreSQL
      ConnectionStrings__Default: Host=postgres;Database=${POSTGRES_DB:-gamehub};Username=${POSTGRES_USER:-gamehub};Password=${POSTGRES_PASSWORD:-change-me}
      RedisCache__IsEnabled: "true"
      RedisCache__ConnectionString: redis:6379
      RedisCache__DatabaseId: "0"
      Hangfire__IsEnabled: "false"
      App__ServerRootAddress: ${GAMEHUB_API_URL:-https://gamehub-api.afonsoft.dev/}
      App__ClientRootAddress: ${GAMEHUB_HUB_URL:-https://gamehub.afonsoft.dev/}
      App__CorsOrigins: ${GAMEHUB_CORS_ORIGINS:-https://gamehub.afonsoft.dev,https://gamehub-admin.afonsoft.dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4601:80"
    networks:
      - gamehub

  angular-hub:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: gamehub-angular-hub
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4600:80"
    networks:
      - gamehub

  angular-admin:
    build:
      context: ./angular-admin/GameHub.UI
      dockerfile: dockerfile
    container_name: gamehub-angular-admin
    restart: unless-stopped
    environment:
      REMOTE_SERVICE_BASE_URL: ${GAMEHUB_API_URL:-https://gamehub-api.afonsoft.dev/}
      APP_BASE_URL: ${GAMEHUB_ADMIN_URL:-https://gamehub-admin.afonsoft.dev/}
    depends_on:
      - backend
    ports:
      - "4602:80"
    networks:
      - gamehub

networks:
  gamehub:
    driver: bridge
