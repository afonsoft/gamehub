<div class="gamehub-category-edit">
  <h1>Category</h1>
  <div class="form-group">
    <label>Name</label>
    <input class="form-control" [(ngModel)]="category.name" (ngModelChange)="onNameChange()" />
  </div>
  <div class="form-group">
    <label>Slug</label>
    <input class="form-control" [(ngModel)]="category.slug" />
  </div>
  <div class="form-group">
    <label>Sort Order</label>
    <input type="number" class="form-control" [(ngModel)]="category.sortOrder" />
  </div>
  <div class="form-group">
    <label>SEO Description</label>
    <textarea class="form-control" [(ngModel)]="category.description" rows="3" maxlength="500"></textarea>
  </div>
  <div class="form-group">
    <label>SEO Keywords</label>
    <input class="form-control" [(ngModel)]="category.keywords" maxlength="256" />
  </div>
  <div class="form-check">
    <input type="checkbox" class="form-check-input" [(ngModel)]="category.isActive" />
    <label class="form-check-label">Active</label>
  </div>
  <button class="btn btn-primary" (click)="save()">Save</button>
</div>
