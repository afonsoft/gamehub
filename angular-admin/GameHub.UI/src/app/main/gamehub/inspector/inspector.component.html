<div class="m-content">
  <div class="m-portlet m-portlet--mobile">
    <div class="m-portlet__head">
      <div class="m-portlet__head-caption">
        <div class="m-portlet__head-title">
          <h3 class="m-portlet__head-text">Inspector / QA</h3>
        </div>
      </div>
    </div>
    <div class="m-portlet__body">
      <p *ngIf="!reports?.length && !loading">No validation reports found.</p>
      <p-table [value]="reports" [loading]="loading" [paginator]="true" [rows]="25">
        <ng-template pTemplate="header">
          <tr>
            <th>Game</th>
            <th>Version</th>
            <th>Status</th>
            <th>Warnings</th>
            <th>Errors</th>
            <th>Created</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-report>
          <tr>
            <td>{{ report.gameTitle || '-' }}</td>
            <td>{{ report.version || '-' }}</td>
            <td>
              <span class="m-badge" [class.m-badge--success]="report.isValid" [class.m-badge--danger]="!report.isValid">
                {{ report.isValid ? 'Valid' : 'Invalid' }}
              </span>
            </td>
            <td>{{ report.warningsCount }}</td>
            <td>{{ report.errorsCount }}</td>
            <td>{{ report.createdAt | date:'short' }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
