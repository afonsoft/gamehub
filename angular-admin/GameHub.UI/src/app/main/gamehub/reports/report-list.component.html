<div [@routerTransition]>
  <div class="m-subheader">
    <div class="row align-items-center">
      <div class="mr-auto col-auto">
        <h3 class="m-subheader__title m-subheader__title--separator">
          <span>Reports</span>
        </h3>
        <span class="m-section__sub">User-generated reports about games and content.</span>
      </div>
    </div>
  </div>

  <div class="m-content">
    <div class="m-portlet m-portlet--mobile">
      <div class="m-portlet__body">
        <div class="row align-items-center m--margin-bottom-10">
          <div class="col-xl-12">
            <div class="btn-group" role="group" aria-label="Report filters">
              <button
                *ngFor="let status of statuses"
                class="btn"
                [class.btn-primary]="filter === status"
                [class.btn-secondary]="filter !== status"
                (click)="setFilter(status)">
                {{ status }}
              </button>
            </div>
          </div>
        </div>

        <div class="align-items-center">
          <div class="primeng-datatable-container">
            <p-table
              [value]="reports"
              [paginator]="true"
              [rows]="10"
              [scrollable]="true"
              [loading]="loading"
              [rowsPerPageOptions]="[10, 25, 50]"
              [showCurrentPageReport]="true"
              scrollHeight="400px"
              styleClass="p-datatable-striped p-datatable-sm"
              currentPageReportTemplate="Showing {first} to {last} of {totalRecords} reports">
              <ng-template pTemplate="header">
                <tr>
                  <th style="width: 220px">Game</th>
                  <th style="width: 200px">Reason</th>
                  <th style="width: 180px">Reporter</th>
                  <th style="width: 120px">Status</th>
                  <th style="width: 140px">Date</th>
                  <th style="width: 220px">Actions</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-report>
                <tr>
                  <td>{{ report.gameTitle }}</td>
                  <td>{{ report.reason }}</td>
                  <td>{{ report.reporterName || '-' }}</td>
                  <td>
                    <span class="m-badge m-badge--wide" [ngClass]="{
                      'm-badge--warning': report.status === 'Open',
                      'm-badge--info': report.status === 'UnderReview',
                      'm-badge--success': report.status === 'Resolved',
                      'm-badge--metal': report.status === 'Dismissed'
                    }">{{ report.status }}</span>
                  </td>
                  <td>{{ report.createdAt | date:'short' }}</td>
                  <td>
                    <div class="btn-group" role="group" aria-label="Update report status">
                      <button
                        *ngFor="let nextStatus of ['Open', 'UnderReview', 'Resolved', 'Dismissed']"
                        class="btn btn-sm"
                        [class.btn-primary]="report.status === nextStatus"
                        [class.btn-secondary]="report.status !== nextStatus"
                        [disabled]="report.status === nextStatus || updating[report.reportId]"
                        (click)="updateStatus(report, nextStatus)">
                        {{ nextStatus }}
                      </button>
                    </div>
                  </td>
                </tr>
              </ng-template>
              <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="6" class="text-center">No reports found.</td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
