<div class="gamehub-report-list">
  <h1>Reports</h1>

  <div class="quick-filters">
    <button class="btn btn-sm" [class.btn-primary]="filter === 'All'" (click)="setFilter('All')">All</button>
    <button class="btn btn-sm" [class.btn-primary]="filter === 'Open'" (click)="setFilter('Open')">Open</button>
    <button class="btn btn-sm" [class.btn-primary]="filter === 'InProgress'" (click)="setFilter('InProgress')">In Progress</button>
    <button class="btn btn-sm" [class.btn-primary]="filter === 'Resolved'" (click)="setFilter('Resolved')">Resolved</button>
  </div>

  <p-table [value]="reports" [paginator]="true" [rows]="20">
    <ng-template pTemplate="header">
      <tr>
        <th>Game</th>
        <th>Reason</th>
        <th>Reporter</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-report>
      <tr>
        <td>{{ report.gameTitle }}</td>
        <td>{{ report.reason }}</td>
        <td>{{ report.reporterName || '-' }}</td>
        <td><span class="m-badge m-badge--info">{{ report.status }}</span></td>
        <td>{{ report.createdAt | date:'short' }}</td>
      </tr>
    </ng-template>
  </p-table>

  <p *ngIf="!reports.length" class="empty">No reports found.</p>
</div>
