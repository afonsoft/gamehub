<div class="content">
  <div class="m-portlet m-portlet--mobile">
    <div class="m-portlet__head">
      <div class="m-portlet__head-caption">
        <div class="m-portlet__head-title">
          <h3 class="m-portlet__head-text">Uploads</h3>
        </div>
      </div>
    </div>
    <div class="m-portlet__body">
      <p-table [value]="builds" [lazy]="true" (onLazyLoad)="loadBuilds($event)" [paginator]="true"
               [rows]="maxResultCount" [totalRecords]="totalCount" [loading]="loading"
               [rowsPerPageOptions]="[10,25,50]" [showCurrentPageReport]="true"
               currentPageReportTemplate="Showing {first} to {last} of {totalRecords} uploads">
        <ng-template pTemplate="header">
          <tr>
            <th>Game</th>
            <th>Developer</th>
            <th>Version</th>
            <th>Status</th>
            <th>Size</th>
            <th>Uploaded</th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-build>
          <tr>
            <td>{{ build.gameTitle }}</td>
            <td>{{ build.developerName }}</td>
            <td>{{ build.version }}</td>
            <td><span class="m-badge m-badge--info">{{ build.status }}</span></td>
            <td>{{ build.sizeBytes | number }} bytes</td>
            <td>{{ build.createdAt | date:'short' }}</td>
            <td>
              <a [routerLink]="['/app/main/gamehub/uploads', build.id]" class="btn btn-sm btn-primary">Files</a>
              <a [routerLink]="['/app/main/gamehub/games', build.gameId]" class="btn btn-sm btn-secondary">Game</a>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
