<div [@routerTransition]>
  <div class="m-subheader">
    <div class="row align-items-center">
      <div class="mr-auto col-auto">
        <h3 class="m-subheader__title m-subheader__title--separator">
          <span>Uploads</span>
        </h3>
        <span class="m-section__sub">Review and validate uploaded game builds.</span>
      </div>
    </div>
  </div>

  <div class="m-content">
    <div class="m-portlet m-portlet--mobile">
      <div class="m-portlet__body">
        <form autocomplete="off" class="horizontal-form">
          <div class="m-form m-form--label-align-right">
            <div class="row align-items-center m--margin-bottom-10">
              <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12">
                <label for="BuildStatusFilter">Status</label>
                <select id="BuildStatusFilter" class="form-control" [(ngModel)]="status" name="status" (change)="onStatusChange()">
                  <option value="">All statuses</option>
                  <option value="Uploaded">Uploaded</option>
                  <option value="Validating">Validating</option>
                  <option value="Validated">Validated</option>
                  <option value="ValidationFailed">Validation Failed</option>
                  <option value="InReview">In Review</option>
                  <option value="Approved">Approved</option>
                  <option value="Published">Published</option>
                  <option value="Rejected">Rejected</option>
                  <option value="Blocked">Blocked</option>
                </select>
              </div>
              <div class="col-xl-6 col-lg-8 col-md-6 col-sm-12 mt-3 mt-md-0">
                <label for="BuildSearchText">Search</label>
                <div class="input-group">
                  <input id="BuildSearchText" type="text" class="form-control" [(ngModel)]="searchText" name="searchText" placeholder="Search by game or developer" (keyup.enter)="onSearch()" />
                  <div class="input-group-append">
                    <button class="btn btn-primary" type="button" (click)="onSearch()">
                      <i class="la la-search"></i> Search
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>

        <div class="align-items-center">
          <div class="primeng-datatable-container">
            <p-table
              [value]="builds"
              [lazy]="true"
              (onLazyLoad)="loadBuilds($event)"
              [paginator]="true"
              [rows]="maxResultCount"
              [totalRecords]="totalCount"
              [loading]="loading"
              [rowsPerPageOptions]="[10,25,50]"
              [showCurrentPageReport]="true"
              [scrollable]="true"
              scrollHeight="400px"
              styleClass="p-datatable-striped p-datatable-sm"
              currentPageReportTemplate="Showing {first} to {last} of {totalRecords} uploads">
              <ng-template pTemplate="header">
                <tr>
                  <th style="width: 220px">Game</th>
                  <th style="width: 180px">Developer</th>
                  <th style="width: 100px">Version</th>
                  <th style="width: 100px">Status</th>
                  <th style="width: 100px">Size</th>
                  <th style="width: 140px">Uploaded</th>
                  <th style="width: 160px">Actions</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-build>
                <tr>
                  <td>{{ build.gameTitle }}</td>
                  <td>{{ build.developerName }}</td>
                  <td>{{ build.version }}</td>
                  <td>
                    <span class="m-badge m-badge--wide" [ngClass]="{
                      'm-badge--info': build.status === 'Uploaded' || build.status === 'Validating' || build.status === 'Validated',
                      'm-badge--warning': build.status === 'InReview' || build.status === 'Approved',
                      'm-badge--success': build.status === 'Published',
                      'm-badge--danger': build.status === 'ValidationFailed' || build.status === 'Rejected' || build.status === 'Blocked'
                    }">{{ build.status }}</span>
                  </td>
                  <td>{{ formatBytes(build.sizeBytes) }}</td>
                  <td>{{ build.createdAt | date:'short' }}</td>
                  <td>
                    <a [routerLink]="['/app/main/gamehub/uploads', build.id]" class="btn btn-sm btn-primary">
                      <i class="la la-files-o"></i> Files
                    </a>
                    <a [routerLink]="['/app/main/gamehub/games', build.gameId]" class="btn btn-sm btn-secondary">
                      <i class="la la-gamepad"></i> Game
                    </a>
                  </td>
                </tr>
              </ng-template>
              <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="7" class="text-center">No uploads found.</td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
