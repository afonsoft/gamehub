<div [@routerTransition]>
  <div class="m-subheader">
    <div class="row align-items-center">
      <div class="mr-auto col-auto">
        <h3 class="m-subheader__title m-subheader__title--separator">
          <span>Users</span>
        </h3>
        <span class="m-section__sub">Platform users and their developer status.</span>
      </div>
    </div>
  </div>

  <div class="m-content">
    <div class="m-portlet m-portlet--mobile">
      <div class="m-portlet__body">
        <div class="align-items-center">
          <div class="primeng-datatable-container">
            <p-table
              [value]="users"
              [paginator]="true"
              [rows]="10"
              [totalRecords]="totalCount"
              [scrollable]="true"
              [loading]="loading"
              [lazy]="true"
              [rowsPerPageOptions]="[10, 25, 50]"
              [showCurrentPageReport]="true"
              scrollHeight="400px"
              styleClass="p-datatable-striped p-datatable-sm"
              currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
              (onLazyLoad)="loadUsers($event)">
              <ng-template pTemplate="header">
                <tr>
                  <th style="width: 150px">Username</th>
                  <th style="width: 220px">Email</th>
                  <th style="width: 200px">Full Name</th>
                  <th style="width: 100px">Active</th>
                  <th style="width: 100px">Developer</th>
                  <th style="width: 140px">Created</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-user>
                <tr>
                  <td>{{ user.userName }}</td>
                  <td>{{ user.emailAddress }}</td>
                  <td>{{ user.fullName }}</td>
                  <td>
                    <span class="m-badge m-badge--wide" [class.m-badge--success]="user.isActive" [class.m-badge--danger]="!user.isActive">
                      {{ user.isActive ? 'Yes' : 'No' }}
                    </span>
                  </td>
                  <td>
                    <span class="m-badge m-badge--wide" [class.m-badge--success]="user.isDeveloper" [class.m-badge--metal]="!user.isDeveloper">
                      {{ user.isDeveloper ? 'Yes' : 'No' }}
                    </span>
                  </td>
                  <td>{{ user.creationTime | date:'short' }}</td>
                </tr>
              </ng-template>
              <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="6" class="text-center">No users found.</td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
