<div class="gamehub-tag-list">
  <h1>Tags</h1>
  <p-table [value]="tags" [paginator]="false">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-tag>
      <tr>
        <td>{{ tag.name }}</td>
        <td>{{ tag.slug }}</td>
        <td>
          <button class="btn btn-sm btn-danger" (click)="delete(tag)">Delete</button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
