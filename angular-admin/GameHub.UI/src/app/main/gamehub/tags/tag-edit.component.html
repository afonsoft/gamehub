<div class="gamehub-tag-edit">
  <h1>Tag</h1>
  <div class="form-group">
    <label>Name</label>
    <input class="form-control" [(ngModel)]="tag.name" />
  </div>
  <div class="form-group">
    <label>Slug</label>
    <input class="form-control" [(ngModel)]="tag.slug" />
  </div>
  <button class="btn btn-primary" (click)="save()">Save</button>
</div>
