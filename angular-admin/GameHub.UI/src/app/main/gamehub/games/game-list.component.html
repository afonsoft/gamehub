<div [@routerTransition]>
  <div class="m-subheader">
    <div class="row align-items-center">
      <div class="mr-auto col-auto">
        <h3 class="m-subheader__title m-subheader__title--separator">
          <span>Games</span>
        </h3>
        <span class="m-section__sub">Manage and moderate published games.</span>
      </div>
    </div>
  </div>

  <div class="m-content">
    <div class="m-portlet m-portlet--mobile">
      <div class="m-portlet__body">
        <form autocomplete="off" class="horizontal-form">
          <div class="m-form m-form--label-align-right">
            <div class="row align-items-center m--margin-bottom-10">
              <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12">
                <label for="GameStatusFilter">Status</label>
                <select id="GameStatusFilter" class="form-control" [(ngModel)]="status" name="status" (change)="loadGames()">
                  <option value="">All</option>
                  <option value="Draft">Draft</option>
                  <option value="InReview">In Review</option>
                  <option value="Published">Published</option>
                  <option value="Rejected">Rejected</option>
                  <option value="Suspended">Suspended</option>
                </select>
              </div>
            </div>
          </div>
        </form>

        <div class="align-items-center">
          <div class="primeng-datatable-container">
            <p-table
              [value]="games"
              [paginator]="true"
              [rows]="25"
              [totalRecords]="totalRecords"
              [scrollable]="true"
              [lazy]="true"
              scrollHeight="400px"
              styleClass="p-datatable-striped p-datatable-sm"
              (onLazyLoad)="loadGames($event)">
              <ng-template pTemplate="header">
                <tr>
                  <th style="width: 250px">Title</th>
                  <th style="width: 200px">Developer</th>
                  <th style="width: 120px">Status</th>
                  <th style="width: 120px">Actions</th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-game>
                <tr>
                  <td>{{ game.title }}</td>
                  <td>{{ game.developerName }}</td>
                  <td>
                    <span class="m-badge m-badge--wide" [ngClass]="{
                      'm-badge--info': game.status === 'Draft',
                      'm-badge--warning': game.status === 'InReview' || game.status === 'Pending',
                      'm-badge--success': game.status === 'Published',
                      'm-badge--danger': game.status === 'Rejected' || game.status === 'Suspended'
                    }">{{ game.status }}</span>
                  </td>
                  <td>
                    <button class="btn btn-sm btn-warning" (click)="suspend(game)">
                      <i class="la la-ban"></i> Suspend
                    </button>
                  </td>
                </tr>
              </ng-template>
              <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="4" class="text-center">No games found.</td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
