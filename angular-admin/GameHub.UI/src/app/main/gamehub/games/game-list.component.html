<div class="gamehub-game-list">
  <h1>Games</h1>
  <div class="mb-3">
    <label>Status</label>
    <select class="form-control" [(ngModel)]="status" (change)="loadGames()">
      <option value="">All</option>
      <option value="Draft">Draft</option>
      <option value="InReview">InReview</option>
      <option value="Published">Published</option>
      <option value="Rejected">Rejected</option>
      <option value="Suspended">Suspended</option>
    </select>
  </div>
  <p-table [value]="games" [paginator]="true" [rows]="25" [totalRecords]="totalRecords" (onLazyLoad)="loadGames($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Title</th>
        <th>Developer</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-game>
      <tr>
        <td>{{ game.title }}</td>
        <td>{{ game.developerName }}</td>
        <td>{{ game.status }}</td>
        <td>
          <button class="btn btn-sm btn-warning" (click)="suspend(game)">Suspend</button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
