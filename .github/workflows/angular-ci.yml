name: 🅰️ Angular CI

on:
  push:
    branches:
      - "feature/*"
      - "bug/*"
      - "hotfix/*"
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  build-angular-hub:
    name: Build Angular GameHub Hub
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Cache Node Modules
        uses: actions/cache@v6
        with:
          path: angular/node_modules
          key: ${{ runner.os }}-node-hub-${{ hashFiles('angular/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-hub-

      - name: 📦 Install & Build GameHub Hub
        run: |
          cd angular
          npm ci --legacy-peer-deps
          npm run build

  build-angular-admin:
    name: Build Angular GameHub Admin
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 💾 Cache Node Modules
        uses: actions/cache@v6
        with:
          path: angular-admin/GameHub.UI/node_modules
          key: ${{ runner.os }}-node-admin-${{ hashFiles('angular-admin/GameHub.UI/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-admin-

      - name: 📦 Install & Build GameHub Admin
        run: |
          cd angular-admin/GameHub.UI
          npm ci --legacy-peer-deps
          npm run build

  angular-summary:
    name: 📋 Angular CI Summary
    runs-on: ubuntu-latest
    needs: [build-angular-hub, build-angular-admin]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🅰️ Angular Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Angular Hub Build | ${{ needs.build-angular-hub.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Angular Admin Build | ${{ needs.build-angular-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Angular CI pipeline completed!" >> $GITHUB_STEP_SUMMARY
