name: 🧹 Cleanup Old Artifacts

permissions:
  actions: write

on:
  schedule:
    - cron: "0 2 * * *" # Every day at 2:00 AM UTC
  workflow_dispatch:

jobs:
  cleanup:
    name: Clean Up Expired Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Delete Workflow Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            *
          use-regex: true
          fail-on-no-artifacts-match: false
          age: "3 days"
