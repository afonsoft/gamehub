name: 🚀 CI Build & Test

on:
  push:
    branches:
      - main
      - "feature/*"
      - "bugfix/*"
      - "hotfix/*"
      - "refactor/*"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-api:
    name: Build GameHub API (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🗄️ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔨 Build EAF NuGet Packages
        run: |
          echo "Building EAF packages locally"
          bash scripts/setup-eaf-packages.sh

      - name: 💾 Cache NuGet Packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 📦 Restore Dependencies
        run: |
          echo "Restoring NuGet packages for GameHub.sln"
          dotnet restore Api/GameHub.sln --no-cache --force --verbosity normal

      - name: 🏗️ Build Solution
        run: |
          echo "Building GameHub.sln"
          dotnet build Api/GameHub.sln --no-restore --configuration Release --verbosity minimal

      - name: 🧪 Run API Tests
        run: |
          echo "Running tests for GameHub API"
          dotnet test Api/test/GameHub.Tests/ \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage" \
            --verbosity normal \
            --framework net10.0

      - name: 🧪 Run Web Tests
        run: |
          echo "Running web tests for GameHub API"
          dotnet test Api/test/GameHub.Web.Tests/ \
            --configuration Release \
            --logger "trx;LogFileName=test-results-web.trx" \
            --results-directory TestResults \
            --collect:"XPlat Code Coverage" \
            --verbosity normal \
            --framework net10.0

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-api
          path: |
            TestResults/**/*.trx
            TestResults/**/*.coverage
          retention-days: 7

      - name: 🔒 Security Vulnerability Check
        run: |
          echo "Checking for vulnerable NuGet packages"
          dotnet list Api/GameHub.sln package --vulnerable || true

  quality-summary:
    name: 📋 API CI Summary
    runs-on: ubuntu-latest
    needs: [build-api]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🚀 API Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Build & Test | ${{ needs.build-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ API CI pipeline completed!" >> $GITHUB_STEP_SUMMARY
